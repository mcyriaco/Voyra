<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Voyra</title>
    <link rel="stylesheet" href="/Voyra-main/CSS/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="logo">
      <div class="logo-circle">
        <img src="/Voyra-main/imagens/logo.png" width="200px" />
      </div>
    </div>

    <h1>Bem-Vindo!</h1>
    <p>Entre para continuar sua jornada</p>

    <div class="login-card">
      <h2>Faça login com a sua conta</h2>

      <div class="input-group">
        <label>E-mail</label>
        <img src="/Voyra-main/imagens/envelope-regular.svg" width="15px" />
        <input type="email" placeholder="Digite seu email" />
      </div>

      <div class="input-group">
        <label>Senha</label>
        <img src="/Voyra-main/imagens/lock-solid.svg" width="14 px" />
        <input type="password" placeholder="Digite sua senha" />
      </div>

      <div class="options">
        <label> <input type="checkbox" />Lembrar-me </label>
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button>ENTRAR</button>

      <p>ou continue com</p>

      <button class="google-btn">
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
        />
        <span>Continuar com Google</span>
      </button>
    </div>

    <div class="signup">
      Não possui conta?
      <a href="#">Criar conta</a>
    </div>
  </body>
</html>
